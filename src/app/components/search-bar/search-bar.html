<div class="container">
  <label>Brand</label>
  <!-- La recherche se lance uniquement lorsqu'on clique sur le bouton Search. -->
  <input type="text" #brand />
  <button (click)="selectAutos(brand.value)">Search</button> <fa-icon [icon]="faMagnifyingGlass" />
</div>

<div class="cars-container">
  <!-- // terme decorateur avec@   -->
  @for (auto of selectedAutos; track auto.id) {
    <div class="auto-card">
      <img [src]="'/images/' + auto.photo" [alt]="auto.brand + ' ' + auto.model" />
      <div class="details">
        <h3>{{ auto.brand }} {{ auto.model }}</h3>
        <p>
          Power : {{ auto.power }} <br />
          Price : {{ auto.price }} DT <br />
          Only : {{ auto.availability }}
        </p>
      </div>
      <div class="see_more">
        <button (click)="selectCar(auto)">See More...</button>
      </div>
    </div>
  }
</div>
